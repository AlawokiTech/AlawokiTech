<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Owolabi Alawoki — IT Infrastructure and Security Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1030"/>
      <stop offset="55%" stop-color="#241a68"/>
      <stop offset="100%" stop-color="#12456e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6cff"/>
      <stop offset="100%" stop-color="#39b8ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b6cff"/>
      <stop offset="100%" stop-color="#39b8ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>

  <!-- decorative network motif: nodes and links, a nod to 15 years of network engineering -->
  <g stroke="#8b6cff" stroke-width="1.6" opacity="0.30">
    <path d="M1010 74 L1104 128 L1080 226 L976 238 L928 150 Z" fill="none"/>
    <path d="M1104 128 L1198 96"/>
    <path d="M1080 226 L1176 262"/>
    <path d="M928 150 L860 214"/>
    <path d="M976 238 L1010 74"/>
  </g>
  <g fill="#39b8ff" opacity="0.85">
    <circle cx="1010" cy="74" r="7"/><circle cx="1104" cy="128" r="7"/>
    <circle cx="1080" cy="226" r="7"/><circle cx="976" cy="238" r="7"/>
    <circle cx="928" cy="150" r="7"/><circle cx="1198" cy="96" r="5"/>
    <circle cx="1176" cy="262" r="5"/><circle cx="860" cy="214" r="5"/>
  </g>

  <!-- monogram -->
  <rect x="64" y="96" width="132" height="132" rx="30" fill="url(#mark)"/>
  <text x="130" y="187" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62"
        font-weight="700" fill="#0d1030" text-anchor="middle" letter-spacing="1">OA</text>

  <!-- name + role -->
  <text x="236" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66"
        font-weight="700" fill="#ffffff" letter-spacing="0.5">Owolabi Alawoki</text>
  <text x="236" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31"
        font-weight="600" fill="#b9c4ff">IT Infrastructure &amp; Security  ·  Software That Ships</text>

  <rect x="236" y="222" width="132" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="236" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25"
        font-weight="500" fill="#8f9bd4">15 years in networks &amp; security  ·  Simpliflex Systems Ltd</text>
</svg>
