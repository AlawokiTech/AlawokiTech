<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Owolabi Alawoki — IT Infrastructure and Security">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0e2b"/><stop offset="48%" stop-color="#291d75"/><stop offset="100%" stop-color="#0f4a72"/>
  </linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8b6cff"/><stop offset="100%" stop-color="#39b8ff"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000714" stop-opacity="0.55"/>
  </radialGradient>

  <!-- faded background motifs: the kit this work actually runs on -->
  <g id="rack" stroke="#bcd8ff" stroke-width="2.4" fill="none">
    <rect x="0" y="0" width="76" height="96" rx="7"/>
    <line x1="0" y1="32" x2="76" y2="32"/><line x1="0" y1="64" x2="76" y2="64"/>
    <circle cx="14" cy="16" r="3.4"/><circle cx="14" cy="48" r="3.4"/><circle cx="14" cy="80" r="3.4"/>
    <line x1="30" y1="16" x2="64" y2="16"/><line x1="30" y1="48" x2="64" y2="48"/><line x1="30" y1="80" x2="64" y2="80"/>
  </g>
  <g id="shield" stroke="#bcd8ff" stroke-width="2.4" fill="none">
    <path d="M44 0 L88 17 v38 c0 30 -20 46 -44 55 c-24 -9 -44 -25 -44 -55 V17 Z"/>
    <circle cx="44" cy="48" r="9"/><line x1="44" y1="57" x2="44" y2="72"/>
  </g>
  <g id="term" stroke="#bcd8ff" stroke-width="2.4" fill="none">
    <rect x="0" y="0" width="104" height="72" rx="8"/><line x1="0" y1="20" x2="104" y2="20"/>
    <circle cx="12" cy="10" r="3"/><circle cx="24" cy="10" r="3"/>
    <polyline points="16,38 28,48 16,58"/><line x1="38" y1="58" x2="66" y2="58"/>
  </g>
  <g id="lock" stroke="#bcd8ff" stroke-width="2.4" fill="none">
    <rect x="0" y="26" width="62" height="46" rx="8"/>
    <path d="M13 26 v-9 a18 18 0 0 1 36 0 v9"/><circle cx="31" cy="47" r="5"/>
  </g>
  <g id="cloud" stroke="#bcd8ff" stroke-width="2.4" fill="none">
    <path d="M22 60 a22 22 0 0 1 4 -43 a30 30 0 0 1 56 8 a19 19 0 0 1 -2 35 Z"/>
  </g>
  <g id="net" stroke="#bcd8ff" stroke-width="2.2" fill="none">
    <path d="M0 40 L54 8 L96 52 L60 104 L6 88 Z"/><path d="M54 8 L112 0"/><path d="M60 104 L116 126"/>
    <circle cx="0" cy="40" r="4.6" fill="#bcd8ff"/><circle cx="54" cy="8" r="4.6" fill="#bcd8ff"/>
    <circle cx="96" cy="52" r="4.6" fill="#bcd8ff"/><circle cx="60" cy="104" r="4.6" fill="#bcd8ff"/>
    <circle cx="6" cy="88" r="4.6" fill="#bcd8ff"/>
  </g>
</defs>

<rect width="1280" height="380" rx="18" fill="url(#bg)"/>

<!-- background layer, deliberately faint so the wordmark stays dominant -->
<g opacity="0.15">
  <use href="#rack"   transform="translate(64,58)"/>
  <use href="#term"   transform="translate(52,214)"/>
  <use href="#cloud"  transform="translate(196,268)"/>
  <use href="#net"    transform="translate(196,66)"/>
  <use href="#shield" transform="translate(1128,56)"/>
  <use href="#lock"   transform="translate(1156,238)"/>
  <use href="#rack"   transform="translate(1010,246)"/>
  <use href="#net"    transform="translate(968,58) scale(-1,1) translate(-116,0)"/>
</g>

<rect width="1280" height="380" rx="18" fill="url(#vig)"/>

<text x="640" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="72" font-weight="700" fill="#ffffff" letter-spacing="0.5">Owolabi Alawoki</text>
<text x="640" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="30" font-weight="600" fill="#cbd4ff" letter-spacing="3.6">IT INFRASTRUCTURE &amp; SECURITY</text>
<rect x="570" y="242" width="140" height="5" rx="2.5" fill="url(#ac)"/>
<text x="640" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="25" font-weight="500" fill="#93a0d8">15 years in networks &amp; security  ·  Simpliflex Systems Ltd</text>
</svg>
